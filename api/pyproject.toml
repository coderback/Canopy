[project]
name = "canopy"
version = "0.1.0"
description = "Canopy — a group chart of accounts for multi-entity Xero groups"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "cryptography>=43",
    "pyjwt[crypto]>=2.9",
    "procrastinate>=3.0",
    "openai>=1.54",
    "azure-identity>=1.19",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canopy*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated DDL and inline test fixtures read better unwrapped.
"migrations/versions/*" = ["E501"]
"tests/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom, not a mutable default.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "canopy.api.deps.require_role"]
