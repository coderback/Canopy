# Canopy v2 — local stack.
#   docker compose up -d db           # just Postgres, for running the API/tests on the host
#   docker compose up --build         # everything
# Secrets (Xero, LLM, token keys) come from api/.env and are never baked into an image.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: canopy
      POSTGRES_PASSWORD: canopy
      POSTGRES_DB: canopy
    ports:
      - "5432:5432"
    volumes:
      - canopy-pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canopy -d canopy"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: ./api
    command: ["alembic", "upgrade", "head"]
    env_file: ./api/.env
    environment:
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://canopy:canopy@db:5432/canopy
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    command: ["python", "-m", "canopy", "api"]
    env_file: ./api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://canopy_app:canopy_app@db:5432/canopy
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./api
    command: ["python", "-m", "canopy", "worker"]
    env_file: ./api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://canopy_app:canopy_app@db:5432/canopy
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      args:
        # Inlined into the browser bundle at build time: must be host-reachable.
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  canopy-pg:
