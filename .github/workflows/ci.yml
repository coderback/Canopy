name: CI

on:
  push:
    branches: [v2]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canopy
          POSTGRES_PASSWORD: canopy
          POSTGRES_DB: canopy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U canopy" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      # Same roles and test database as docker/postgres/init.sql.
      - name: Create app role and test database
        env:
          PGPASSWORD: canopy
        run: psql -h localhost -U canopy -d canopy -v ON_ERROR_STOP=1 -f ../docker/postgres/init.sql
      - run: pip install -e ".[dev]"
      - run: ruff check canopy tests migrations
      - run: pytest -q

  contract:
    # The web app's TypeScript types are generated from the API's OpenAPI schema;
    # fail if someone changed the API without regenerating web/openapi.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "./api"
      - name: OpenAPI schema is up to date
        run: |
          python -m canopy openapi > /tmp/openapi.json
          diff -u web/openapi.json /tmp/openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api-types.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000
